<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" width="760" height="120" role="img" aria-label="渴望已久 — AI for Science, discovery agents and experiment automation">
  <style>
    :root { color-scheme: light dark; }
    .ttl  { font: 600 26px ui-sans-serif, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14302a; }
    .sub  { font: 400 14px ui-sans-serif, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #55736b; }
    .star { fill: #059669; animation: twinkle 2.4s ease-in-out infinite both; }
    .s2 { animation-delay: .5s; fill: #4f46e5 } .s3 { animation-delay: 1s }
    .s4 { animation-delay: 1.5s; fill: #4f46e5 } .s5 { animation-delay: 2s }
    @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.15) } }
    .link { stroke: #059669; stroke-width: 1; opacity: .4; stroke-dasharray: 3 3; animation: drift 6s linear infinite both; }
    @keyframes drift { to { stroke-dashoffset: -24 } }
    .wipe { animation: reveal 3.2s steps(24, end) both; }
    @keyframes reveal { from { width: 0 } to { width: 520px } }
    .caretmove { animation: caret 3.2s steps(24, end) both; }
    @keyframes caret { from { transform: translateX(0) } to { transform: translateX(520px) } }
    .blink { animation: blink 1.1s step-end infinite both; }
    @keyframes blink { 50% { opacity: 0 } }
    .star, .caretmove rect { transform-box: fill-box; transform-origin: center; }
    @media (prefers-color-scheme: dark) {
      .ttl { fill: #e6f5ef } .sub { fill: #9db8ae }
    }
  </style>

  <!-- constellation motif -->
  <g transform="translate(20,26)">
    <line class="link" x1="8" y1="14" x2="30" y2="4"/>
    <line class="link" x1="30" y1="4" x2="52" y2="22"/>
    <line class="link" x1="52" y1="22" x2="34" y2="44"/>
    <line class="link" x1="34" y1="44" x2="8" y2="14"/>
    <line class="link" x1="52" y1="22" x2="66" y2="8"/>
    <circle class="star"    cx="8"  cy="14" r="3.4"/>
    <circle class="star s2" cx="30" cy="4"  r="3"/>
    <circle class="star s3" cx="52" cy="22" r="3.8"/>
    <circle class="star s4" cx="34" cy="44" r="3"/>
    <circle class="star s5" cx="66" cy="8"  r="2.6"/>
  </g>

  <clipPath id="tw"><rect class="wipe" x="104" y="18" width="520" height="40"/></clipPath>
  <text class="ttl" x="106" y="46" clip-path="url(#tw)">渴望已久 · AI for Science × 探索与发现</text>
  <g class="caretmove"><rect class="blink" x="106" y="24" width="3" height="28" rx="1" fill="#059669"/></g>

  <text class="sub" x="106" y="78">USTC · hypothesis-discovery agents · autonomous experiment pipelines · offline-first &amp; reproducible</text>
  <g transform="translate(106,92)">
    <rect width="86" height="4" rx="2" fill="#059669" opacity=".85"/>
    <rect x="92" width="52" height="4" rx="2" fill="#4f46e5" opacity=".85"/>
  </g>
</svg>
